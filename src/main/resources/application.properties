spring.application.name=retailpos

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/retailpos}
spring.datasource.username=${DB_USERNAME:retailpos_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

logging.level.org.springframework.security=DEBUG
logging.level.com.retailpos=DEBUG

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=retailpos
app.jwt.access-token-ttl=PT15M